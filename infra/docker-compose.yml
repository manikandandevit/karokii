services:
  postgres:
    image: postgres:16
    container_name: karaoke-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: karaoke_db
      POSTGRES_USER: karaoke_user
      POSTGRES_PASSWORD: karaoke_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
